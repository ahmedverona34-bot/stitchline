[package]
name = "stitchline"
version = "1.0.4"
edition = "2021"
description = "Stitchline: pattern sewing and laser cutting jobs for SLW sewing machines"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stitchline-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Settings › Check for updates and the Update button: signed installers from the GitHub releases (Windows TLS, no C build)
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
# a second Stitchline started by opening a project file hands the file to the open window
tauri-plugin-single-instance = "2"
serde_json = { version = "1", features = ["preserve_order"] }

# F11 full screen in one step (main.rs mod full_screen)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
